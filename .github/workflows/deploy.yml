name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Frontend Dependencies & Build
        working-directory: synaptekportafolio
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install Backend Dependencies & Build
        working-directory: server
        run: |
          pnpm install
          pnpm build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Frontend with rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            synaptekportafolio/dist/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/napsitek.com/

      - name: Prepare Remote Backend Directory
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p ~/napsitek-backend"

      - name: Sync Backend Files
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude 'node_modules' \
            --exclude '.env' \
            server/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/napsitek-backend/

      - name: Create Remote .env File
        env:
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: |
          cat <<EOF > server.env
          PORT=3003
          NODE_ENV=production
          FRONTEND_URL=https://napsitek.com
          GOOGLE_CLIENT_EMAIL="${GOOGLE_CLIENT_EMAIL}"
          GOOGLE_PRIVATE_KEY="${GOOGLE_PRIVATE_KEY}"
          GOOGLE_CALENDAR_ID="${GOOGLE_CALENDAR_ID}"
          EOF

      - name: Transfer .env File to VPS
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            server.env \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:~/napsitek-backend/.env

      - name: Install Remote Production Dependencies & Restart Service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            export PATH=\$HOME/.local/bin:\$PATH
            cd ~/napsitek-backend
            pnpm install --prod
            pm2 reload napsitek-backend || pm2 start dist/index.js --name napsitek-backend --max-memory-restart 150M
          "
